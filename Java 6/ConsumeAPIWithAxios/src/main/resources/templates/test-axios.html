<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quản lý sinh viên</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
<button onclick="getStudent()">Danh sách sinh viên</button>
<button onclick="postStudent()">Thêm sinh viên</button>
<button onclick="putStudent()">Cập nhật sinh viên</button>
<button onclick="deleteStudent()">Xóa sinh viên</button>
<ul id="listStudent"></ul>
</body>
<script>
    function getStudent() {
        axios.get("https://sd20202-3b7f7-default-rtdb.asia-southeast1.firebasedatabase.app/student.json")
            .then(function (response) {
                const data = response.data;
                const listElement = document.getElementById('listStudent');
                listElement.innerHTML = ""; // Clear existing list
                if (!data) {
                    listElement.innerHTML = "<li>No students found</li>";
                    return;
                }
                Object.keys(data).forEach(function (key) {
                    const student = data[key];
                    const item = document.createElement("li");
                    item.textContent =
                        `Mã: ${student.id},  Tên: ${student.name}, Điểm: ${student.mark}, Giới tính: ${student.gender ? "Nam" : "Nữ"}`;
                    listElement.appendChild(item);
                })
            })
            .catch(function (error) {
                console.error("Error fetching student data:", error);
            })
    }

    function getStudentById() {

    }

    function postStudent() {
        const student = {
            id: "SV999",
            name: "Nguyễn Văn Sigma",
            mark: 8.5,
            gender: true
        }
        axios.post("https://sd20202-3b7f7-default-rtdb.asia-southeast1.firebasedatabase.app/student.json", student)
            .then(function (response) {
                console.log("Student added successfully:", response.data);
            })
            .catch(function (error) {
                console.error("Error adding student:", error);
            })
    }

    function putStudent() {
        const student = {
            id: "SV01",
            name: "Nguyễn Văn ABCDEFJ",
            mark: 9.0,
            gender: true
        }
        axios.put("https://sd20202-3b7f7-default-rtdb.asia-southeast1.firebasedatabase.app/student/-NfXoYJ3k1x8vYJzX5Qp.json", student)
            .then(function (response) {
                console.log("Student updated successfully:", response.data);
            })
            .catch(function (error) {
                console.error("Error updating student:", error);
            })

    }

    function deleteStudent() {
        const key = "-OeRC9eAWduEFqaCHp3b";
        axios.delete(`https://sd20202-3b7f7-default-rtdb.asia-southeast1.firebasedatabase.app/student/${key}.json`)
            .then(function (response) {
                console.log("Student deleted successfully:", response.data);
            })
            .catch(function (error) {
                console.error("Error deleting student:", error);
            })
    }

</script>
</html>
