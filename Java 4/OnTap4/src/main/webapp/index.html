<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
        <h2>AJAX Hiển thị Sinh Viên</h2>
        <button id="btnLoad">Tải dữ liệu</button>

        <script>
            document.getElementById("btnLoad").addEventListener("click", function() {
                fetch("/api/sanpham/get-all")
                    .then(response => response.json())
                    .then(data => {
                        console.log("Danh sách sinh viên:", data);
                        data.forEach(sv => {
                            console.log(`Mã: ${sv.id}, Tên: ${sv.ten}, Tuổi: ${sv.tuoi}, Giới tính: ${sv.gioiTinh ? 'Nam' : 'Nữ'}, Ngành: ${sv.nganhHoc}`);
                        });
                    })
                    .catch(error => console.error("Lỗi:", error));
            });
        </script>
</body>
</html>
