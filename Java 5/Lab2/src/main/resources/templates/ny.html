<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Người yêu</title>
</head>
<body>
<h2>Lover list</h2>
<ul>
    <li th:if="${lovers.size() == 0}">không có</li>
    <li th:each="ny : ${lovers}">
        <span th:text="${ny.nickName}"></span> -
        <span th:text="${ny.namSinh}"></span>
    </li>
</ul>
<h3>Add new lover</h3>
<form th:action="@{/lab-1/nguoi-yeu}" method="post">
    Nickname: <input type="text" name="nickName" required /><br/>
    Năm sinh: <input type="number" name="namSinh" required /><br/>
    <button type="submit">Thêm</button>
</form>
</body>
</html>
