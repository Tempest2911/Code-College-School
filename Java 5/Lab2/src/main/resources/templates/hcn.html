<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Hình chữ nhật</title>
</head>
<body>
<form th:action="@{/lab-1/hinh-chu-nhat}" method="post">
    Chiều dài: <input type="number" name="chieuDai" th:value="${chieuDai}" required /><br/>
    Chiều rộng: <input type="number" name="chieuRong" th:value="${chieuRong}" required /><br/>
    <button type="submit" value="dienTich">Tính diện tích</button>
    <button type="submit" value="chuVi">Tính chu vi</button>
</form>
<div th:if="${message}">
    <p th:text="${message}"></p>
</div>
</body>
</html>
