<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LALALA</title>
</head>
<body>

<h1>User List</h1>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Passowrd</th>
        <th>Role</th>
        <th>Email</th>
        <th>Created At</th>
        <th>Status</th>
    </tr>
    <tr th:each="user : ${users}">
        <td th:text="${user.id}"></td>
        <td th:text="${user.username}"></td>
        <td th:text="${user.passwordHash}"></td>
        <td th:text="${user.role}"></td>
        <td th:text="${user.email}"></td>
        <td th:text="${#dates.format(user.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
        <td th:text="${user.status}"></td>
    </tr>
</table>
</body>
</html>
