<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Specialties</title>
    <meta charset="UTF-8"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>
<div class="container mt-4">
    <h2>Specialties</h2>
    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Description</th>
            <th>Department</th>
            <th>Created At</th>
            <th>Updated At</th>
            <th>Status</th>
            <th>Note</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="specialty : ${specialties}">
            <td th:text="${specialty.id}"></td>
            <td th:text="${specialty.name}"></td>
            <td th:text="${specialty.description}"></td>
            <td th:text="${specialty.departmentID?.name}"></td>
            <td th:text="${#dates.format(specialty.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
            <td th:text="${#dates.format(specialty.updatedAt, 'yyyy-MM-dd HH:mm')}"></td>
            <td th:text="${specialty.status}"></td>
            <td th:text="${specialty.note}"></td>
        </tr>
        </tbody>
    </table>
    <a href="/" class="btn btn-primary">Back to Home</a>
</div>
</body>
</html>
