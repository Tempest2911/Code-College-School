<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Clinics</title>
    <meta charset="UTF-8"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>
<div class="container mt-4">
    <h2>Clinics</h2>
    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>Clinic ID</th>
            <th>Name</th>
            <th>Address</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Open Time</th>
            <th>Close Time</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="clinic : ${clinics}">
            <td th:text="${clinic.id}"></td>
            <td th:text="${clinic.name}"></td>
            <td th:text="${clinic.address}"></td>
            <td th:text="${clinic.phone}"></td>
            <td th:text="${clinic.email}"></td>
            <td th:text="${clinic.openTime}"></td>
            <td th:text="${clinic.closeTime}"></td>
        </tr>
        </tbody>
    </table>
    <a href="/" class="btn btn-primary">Back to Home</a>
</div>
</body>
</html>
