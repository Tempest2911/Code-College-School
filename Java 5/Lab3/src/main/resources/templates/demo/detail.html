<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div>
    <img th:src="@{/Photo/photo.jpg}" alt="Avatar" width="150" height="150"><hr>
    Email:
    <b th:text="${staff.id}"></b> <hr>
    Họ và tên:
    <b th:text="${#strings.capitalizeWords(staff.fullName)}"></b> <hr>
    Giới tính:
    <b th:text="${staff.gender ? 'nam' : 'nu'}"></b> <hr>
    Ngày sinh:
    <b th:text="${#dates.format(staff.birthday, 'dd-MM-yyyy')}"></b> <hr>
    Cấp bậc:
    <th:block th:switch="${staff.level}">
        <b th:case="0">Úy</b>
        <b th:case="1">Tá</b>
        <b th:case="2">Tướng</b>
        <b th:case="*">Chưa có</b>
    </th:block> <hr>
    Salary:
    <b>$<span th:text="${#numbers.formatDecimal(staff.salary, 1, 'COMMA', 2, 'POINT')}"></span></b> <hr>
</div>

</body>
</html>
