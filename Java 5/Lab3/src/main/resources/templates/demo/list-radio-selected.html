<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h3>Fill to SelectBox</h3>
<select name="cbo">
    <th:block th:each="staff : ${list3}">
        <option th:value="${staff.id}" th:text="${staff.fullName}"></option>
    </th:block>
</select>

<h3>Create Radio Button Group</h3>
<th:block th:each="staff:${list3}">
    <label>
        <br>
        <input type="radio" name="rdo" th:value="${staff.id}">
        <th:block th:text="${staff.fullName}">
        </th:block>
    </label>
</th:block>
</body>
</html>
