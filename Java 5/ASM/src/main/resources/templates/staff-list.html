<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Staff Task Board</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body { background: #f4f6f8; font-family: 'Segoe UI', sans-serif; }
        .kanban-board { display: flex; gap: 24px; padding: 32px 0; }
        .kanban-column {
            flex: 1;
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            min-height: 500px;
        }
        .kanban-column h4 {
            text-align: center;
            margin-bottom: 18px;
            font-weight: 600;
            text-transform: capitalize; /* Todo, In Progress, Done */
        }
        .task-card {
            margin-bottom: 16px;
            cursor: grab;
            border-left: 5px solid #0d6efd;
        }
        .drag-over {
            border: 2px dashed #0d6efd;
        }

        /* Toast CSS */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            min-width: 260px;
            padding: 12px 16px;
            margin-top: 10px;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            z-index: 9999;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.35s ease;
            box-shadow: 0 6px 18px rgba(0,0,0,0.12);
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.info { background: #0d6efd; }       /* blue */
        .toast.success { background: #198754; }    /* green */
        .toast.error { background: #dc3545; }      /* red */
        .toast.warning { background: #ffc107; color: #000; } /* yellow with black text */
        /* ensure text color contrast for other toasts */
        .toast.info, .toast.success, .toast.error { color: #fff; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Task Board</a>
        <div class="d-flex">
            <a href="/asm/logout" class="btn btn-danger btn-sm">Logout</a>
        </div>
    </div>
</nav>

<!-- Toast container (must be inside body) -->
<div id="toast-container"></div>

<div class="container mt-4">
    <h2 class="text-center mb-4">📌 Task Board - Department</h2>

    <!-- Thông báo các task sắp đến hạn cho staff -->
    <div th:if="${dueSoonTasks != null and !dueSoonTasks.isEmpty()}">
        <div th:each="t : ${dueSoonTasks}" class="alert alert-warning" style="font-weight:bold;">
            <span>
                ⚠️ Task "<span th:text="${t.title}"></span>" sẽ đến hạn lúc <span th:text="${#temporals.format(t.deadline,'yyyy-MM-dd HH:mm')}"></span>!
            </span>
        </div>
    </div>

    <div class="kanban-board">
        <div class="kanban-column" data-status="Todo">
            <h4>📝 Todo</h4>
            <div th:each="t : ${tasks}" th:if="${t.status == 'Todo'}"
                 class="card task-card" draggable="true"
                 th:attr="data-id=${t.id}">
                <div class="card-body">
                    <h5 class="card-title" th:text="${t.title}"></h5>
                    <p class="card-text" th:text="${t.description}"></p>
                    <div class="mb-2">
                        <span class="badge bg-secondary"
                              th:text="'Deadline: ' + ${#temporals.format(t.deadline,'yyyy-MM-dd HH:mm')}"></span>
                        <span class="badge bg-info"
                              th:text="'Assigned: ' + ${t.assignedTo.fullName}"></span>
                        <span class="badge bg-dark"
                              th:text="'Dept: ' + ${t.department.name}"></span>
                        <span class="badge bg-light text-dark"
                              th:text="'By: ' + ${t.createdBy.fullName}"></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="kanban-column" data-status="In-Progress">
            <h4>🚀 In Progress</h4>
            <div th:each="t : ${tasks}" th:if="${t.status == 'In-Progress'}"
                 class="card task-card" draggable="true"
                 th:attr="data-id=${t.id}">
                <div class="card-body">
                    <h5 class="card-title" th:text="${t.title}"></h5>
                    <p class="card-text" th:text="${t.description}"></p>
                    <div class="mb-2">
                        <span class="badge bg-secondary"
                              th:text="'Deadline: ' + ${#temporals.format(t.deadline,'yyyy-MM-dd HH:mm')}"></span>
                        <span class="badge bg-info"
                              th:text="'Assigned: ' + ${t.assignedTo.fullName}"></span>
                        <span class="badge bg-dark"
                              th:text="'Dept: ' + ${t.department.name}"></span>
                        <span class="badge bg-light text-dark"
                              th:text="'By: ' + ${t.createdBy.fullName}"></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="kanban-column" data-status="Done">
            <h4>✅ Done</h4>
            <div th:each="t : ${tasks}" th:if="${t.status == 'Done'}"
                 class="card task-card" draggable="true"
                 th:attr="data-id=${t.id}">
                <div class="card-body">
                    <h5 class="card-title" th:text="${t.title}"></h5>
                    <p class="card-text" th:text="${t.description}"></p>
                    <div class="mb-2">
                        <span class="badge bg-secondary"
                              th:text="'Deadline: ' + ${#temporals.format(t.deadline,'yyyy-MM-dd HH:mm')}"></span>
                        <span class="badge bg-info"
                              th:text="'Assigned: ' + ${t.assignedTo.fullName}"></span>
                        <span class="badge bg-dark"
                              th:text="'Dept: ' + ${t.department.name}"></span>
                        <span class="badge bg-light text-dark"
                              th:text="'By: ' + ${t.createdBy.fullName}"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Drag & drop and basic logic -->
<script>
    // Attach drag listeners to current .task-card elements (for those rendered server-side)
    function attachDragListeners() {
        document.querySelectorAll(".task-card").forEach(card => {
            if (!card._dragAttached) {
                card.addEventListener("dragstart", () => card.classList.add("dragging"));
                card.addEventListener("dragend", () => card.classList.remove("dragging"));
                card._dragAttached = true; // mark so we don't double attach
            }
        });
    }

    // initial attach
    attachDragListeners();

    // setup column drop listeners
    document.querySelectorAll(".kanban-column").forEach(column => {
        column.addEventListener("dragover", e => { e.preventDefault(); column.classList.add("drag-over"); });
        column.addEventListener("dragleave", () => { column.classList.remove("drag-over"); });

        column.addEventListener("drop", () => {
            column.classList.remove("drag-over");
            const dragging = document.querySelector(".dragging");
            if (!dragging) return;

            column.appendChild(dragging);
            const taskId = dragging.getAttribute("data-id");
            const newStatus = column.getAttribute("data-status");

            fetch(`/staff/task/status/${taskId}`, {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: "status=" + encodeURIComponent(newStatus)
            }).then(() => console.log("Updated task " + taskId + " -> " + newStatus))
                .catch(err => console.error("Failed to update status:", err));
        });
    });
</script>

<!-- websocket libs (only once) -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>


<script>
    // helper: show toast
    function showToast(message, type = "info") {
        const container = document.getElementById("toast-container");
        const toast = document.createElement("div");
        toast.className = `toast ${type}`;
        toast.innerText = message;
        container.appendChild(toast);
        // trigger show (allow DOM insert)
        setTimeout(() => toast.classList.add("show"), 50);
        // auto hide
        setTimeout(() => {
            toast.classList.remove("show");
            setTimeout(() => toast.remove(), 350);
        }, 3000);
    }

    // create/draggable helper for newly created cards
    function makeDraggable(card) {
        if (!card._dragAttached) {
            card.addEventListener("dragstart", () => card.classList.add("dragging"));
            card.addEventListener("dragend", () => card.classList.remove("dragging"));
            card._dragAttached = true;
        }
    }

    // updateTaskList: receives DTO from backend via websocket
    function updateTaskList(task) {
        console.log("Realtime update:", task);

        if (task.action === "CREATED") showToast(`Đã tạo task: ${task.title}`, "success");
        else if (task.action === "UPDATED") showToast(`Đã cập nhật task: ${task.title}`, "info");
        else if (task.action === "DELETED") showToast(`Đã xóa task: ${task.title}`, "error");
        else if (task.action === "Created" || task.action === "Updated" || task.deadline < 24*60*60*1000) showToast(`Task "${task.title}" sắp hết hạn!`, "warning");

        // So sánh id cùng kiểu để tránh lỗi (dùng assignedToId mới)
        const assignedId = task.assignedToId ? Number(task.assignedToId) : null;
        const currentId = Number(window.currentStaffId);

        // Nếu assignedTo không phải là user hiện tại thì xóa task khỏi giao diện (nếu có)
        if (!assignedId || assignedId !== currentId) {
            const oldCard = document.querySelector(`.task-card[data-id="${task.id}"]`);
            if (oldCard) oldCard.remove();
            return;
        }

        // handle delete
        if (task.action === "DELETED") {
            const oldCard = document.querySelector(`.task-card[data-id="${task.id}"]`);
            if (oldCard) oldCard.remove();
            return;
        }

        // find existing card
        const existingCard = document.querySelector(`.task-card[data-id="${task.id}"]`);
        let card = existingCard;
        const isNewCard = !card;

        if (isNewCard) {
            card = document.createElement("div");
            card.className = "card task-card";
            card.setAttribute("draggable", "true");
            card.setAttribute("data-id", task.id);
            makeDraggable(card);
        }

        // compute fields: support both nested objects (task.assignedTo.fullName) or flattened names (task.assignedToName)
        const title = (task.title !== undefined) ? task.title : (existingCard?.querySelector(".card-title")?.textContent || "No Title");
        const description = (task.description !== undefined) ? task.description : (existingCard?.querySelector(".card-text")?.textContent || "");
        const deadline = task.deadline ? (task.deadline.substring(0,16).replace('T',' ')) : (existingCard?.querySelector(".badge.bg-secondary")?.textContent.replace("Deadline: ","") || "No Deadline");
        const assignedToName = task.assignedTo?.fullName || task.assignedToName || (existingCard?.querySelector(".badge.bg-info")?.textContent.replace("Assigned: ","") || "Unassigned");
        const departmentName = task.department?.name || task.departmentName || (existingCard?.querySelector(".badge.bg-dark")?.textContent.replace("Dept: ","") || "N/A");
        const createdByName = task.createdBy?.fullName || task.createdByName || (existingCard?.querySelector(".badge.bg-light")?.textContent.replace("By: ","") || "System");

        // build innerHTML
        card.innerHTML = `
            <div class="card-body">
                <h5 class="card-title">${escapeHtml(title)}</h5>
                <p class="card-text">${escapeHtml(description)}</p>
                <div class="mb-2">
                    <span class="badge bg-secondary">Deadline: ${escapeHtml(deadline)}</span>
                    <span class="badge bg-info">Assigned: ${escapeHtml(assignedToName)}</span>
                    <span class="badge bg-dark">Dept: ${escapeHtml(departmentName)}</span>
                    <span class="badge bg-light text-dark">By: ${escapeHtml(createdByName)}</span>
                </div>
            </div>
        `;

        // ensure draggable listeners
        makeDraggable(card);

        // append/move card into proper column
        let statusKey = (task.status || "").toUpperCase().replace("_","-"); // e.g. "IN-PROGRESS"
        let selector = statusKey === "TODO" ? '[data-status="Todo"]'
            : statusKey === "IN-PROGRESS" ? '[data-status="In-Progress"]'
                : statusKey === "DONE" ? '[data-status="Done"]' : null;

        if (selector) {
            const column = document.querySelector(selector);
            if (column && card.parentElement !== column) {
                column.appendChild(card);
            } else if (!column && isNewCard) {
                // if unknown status, append to first column (fallback)
                document.querySelector(".kanban-board").firstElementChild.appendChild(card);
            }
        } else if (isNewCard) {
            // fallback append to Todo column
            document.querySelector('[data-status="Todo"]').appendChild(card);
        }
    }

    // simple HTML escaper to avoid injection when interpolating
    function escapeHtml(str) {
        if (str === null || str === undefined) return "";
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // WebSocket setup (one place)
    const socket = new SockJS('/ws');
    const stompClient = Stomp.over(socket);

    stompClient.connect({}, function (frame) {
        console.log("Connected: " + frame);

        // topic broadcast (everyone)
        stompClient.subscribe('/topic/tasks', function (message) {
            const task = JSON.parse(message.body);
            updateTaskList(task);
        });

        // personal queue (if server sends to specific user)
        stompClient.subscribe('/user/queue/tasks', function (message) {
            const task = JSON.parse(message.body);
            updateTaskList(task);
        });
    }, function (err) {
        console.error("WebSocket error", err);
    });
</script>

<script th:inline="javascript">
    /*<![CDATA[*/
    window.currentStaffId = /*[[${currentStaff.id}]]*/ 0;
    /*]]>*/
</script>

</body>
</html>
