<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Staff Task Board</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body { background: #f4f6f8; font-family: 'Segoe UI', sans-serif; }
        .kanban-board { display: flex; gap: 24px; padding: 32px 0; }
        .kanban-column {
            flex: 1;
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            min-height: 500px;
        }
        .kanban-column h4 {
            text-align: center;
            margin-bottom: 18px;
            font-weight: 600;
            text-transform: capitalize; /* Todo, In Progress, Done */
        }
        .task-card {
            margin-bottom: 16px;
            cursor: grab;
            border-left: 5px solid #0d6efd;
        }
        .drag-over {
            border: 2px dashed #0d6efd;
        }

        /* Toast CSS */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            min-width: 260px;
            padding: 12px 16px;
            margin-top: 10px;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            z-index: 9999;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.35s ease;
            box-shadow: 0 6px 18px rgba(0,0,0,0.12);
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.info { background: #0d6efd; }       /* blue */
        .toast.success { background: #198754; }    /* green */
        .toast.error { background: #dc3545; }      /* red */
        .toast.warning { background: #ffc107; color: #000; } /* yellow with black text */
        /* ensure text color contrast for other toasts */
        .toast.info, .toast.success, .toast.error { color: #fff; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Task Board</a>
        <div class="d-flex">
            <a href="/asm/logout" class="btn btn-danger btn-sm">Logout</a>
        </div>
    </div>
</nav>

<!-- Toast container (must be inside body) -->
<div id="toast-container"></div>

<div class="container mt-4">
    <h2 class="text-center mb-4">📌 Task Board - Department</h2>
    <div class="kanban-board">
        <div class="kanban-column" data-status="Todo">
            <h4>📝 Todo</h4>
            <div th:each="t : ${tasks}" th:if="${t.status == 'Todo'}"
                 class="card task-card" draggable="true"
                 th:attr="data-id=${t.id}">
                <div class="card-body">
                    <h5 class="card-title" th:text="${t.title}"></h5>
                    <p class="card-text" th:text="${t.description}"></p>
                    <div class="mb-2">
                        <span class="badge bg-secondary"
                              th:text="'Deadline: ' + ${#temporals.format(t.deadline,'yyyy-MM-dd HH:mm')}"></span>
                        <span class="badge bg-info"
                              th:text="'Assigned: ' + ${t.assignedTo.fullName}"></span>
                        <span class="badge bg-dark"
                              th:text="'Dept: ' + ${t.department.name}"></span>
                        <span class="badge bg-light text-dark"
                              th:text="'By: ' + ${t.createdBy.fullName}"></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="kanban-column" data-status="In-Progress">
            <h4>🚀 In Progress</h4>
            <div th:each="t : ${tasks}" th:if="${t.status == 'In-Progress'}"
                 class="card task-card" draggable="true"
                 th:attr="data-id=${t.id}">
                <div class="card-body">
                    <h5 class="card-title" th:text="${t.title}"></h5>
                    <p class="card-text" th:text="${t.description}"></p>
                    <div class="mb-2">
                        <span class="badge bg-secondary"
                              th:text="'Deadline: ' + ${#temporals.format(t.deadline,'yyyy-MM-dd HH:mm')}"></span>
                        <span class="badge bg-info"
                              th:text="'Assigned: ' + ${t.assignedTo.fullName}"></span>
                        <span class="badge bg-dark"
                              th:text="'Dept: ' + ${t.department.name}"></span>
                        <span class="badge bg-light text-dark"
                              th:text="'By: ' + ${t.createdBy.fullName}"></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="kanban-column" data-status="Done">
            <h4>✅ Done</h4>
            <div th:each="t : ${tasks}" th:if="${t.status == 'Done'}"
                 class="card task-card" draggable="true"
                 th:attr="data-id=${t.id}">
                <div class="card-body">
                    <h5 class="card-title" th:text="${t.title}"></h5>
                    <p class="card-text" th:text="${t.description}"></p>
                    <div class="mb-2">
                        <span class="badge bg-secondary"
                              th:text="'Deadline: ' + ${#temporals.format(t.deadline,'yyyy-MM-dd HH:mm')}"></span>
                        <span class="badge bg-info"
                              th:text="'Assigned: ' + ${t.assignedTo.fullName}"></span>
                        <span class="badge bg-dark"
                              th:text="'Dept: ' + ${t.department.name}"></span>
                        <span class="badge bg-light text-dark"
                              th:text="'By: ' + ${t.createdBy.fullName}"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Drag & drop and basic logic -->
<script>
    // Attach drag listeners to current .task-card elements (for those rendered server-side)
    function attachDragListeners() {
        document.querySelectorAll(".task-card").forEach(card => {
            if (!card._dragAttached) {
                card.addEventListener("dragstart", () => card.classList.add("dragging"));
                card.addEventListener("dragend", () => card.classList.remove("dragging"));
                card._dragAttached = true; // mark so we don't double attach
            }
        });
    }

    // initial attach
    attachDragListeners();

    // setup column drop listeners
    document.querySelectorAll(".kanban-column").forEach(column => {
        column.addEventListener("dragover", e => { e.preventDefault(); column.classList.add("drag-over"); });
        column.addEventListener("dragleave", () => { column.classList.remove("drag-over"); });

        column.addEventListener("drop", () => {
            column.classList.remove("drag-over");
            const dragging = document.querySelector(".dragging");
            if (!dragging) return;

            column.appendChild(dragging);
            const taskId = dragging.getAttribute("data-id");
            const newStatus = column.getAttribute("data-status");

            fetch(`/staff/task/status/${taskId}`, {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: "status=" + encodeURIComponent(newStatus)
            }).then(() => console.log("Updated task " + taskId + " -> " + newStatus))
                .catch(err => console.error("Failed to update status:", err));
        });
    });
</script>

<!-- websocket libs (only once) -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script>
    // helper: show toast
    function showToast(message, type = "info") {
        const container = document.getElementById("toast-container");
        const toast = document.createElement("div");
        toast.className = `toast ${type}`;
        toast.innerText = message;
        container.appendChild(toast);
        // trigger show (allow DOM insert)
        setTimeout(() => toast.classList.add("show"), 50);
        // auto hide
        setTimeout(() => {
            toast.classList.remove("show");
            setTimeout(() => toast.remove(), 350);
        }, 3000);
    }

    // create/draggable helper for newly created cards
    function makeDraggable(card) {
        if (!card._dragAttached) {
            card.addEventListener("dragstart", () => card.classList.add("dragging"));
            card.addEventListener("dragend", () => card.classList.remove("dragging"));
            card._dragAttached = true;
        }
    }

    function updateTaskList(task) {
        console.log("Realtime update:", task);

        // toast
        if (task.action === "CREATED") showToast(`Admin đã tạo task: ${task.title}`, "success");
        else if (task.action === "UPDATED") showToast(`Admin đã cập nhật task: ${task.title}`, "info");
        else if (task.action === "DELETED") showToast(`Admin đã xóa task: ${task.title}`, "error");

        // nếu bị xóa thì remove card rồi return
        if (task.action === "DELETED") {
            const oldCard = document.querySelector(`.task-card[data-id="${task.id}"]`);
            if (oldCard) oldCard.remove();
            return;
        }

        // tìm card cũ (nếu có)
        let card = document.querySelector(`.task-card[data-id="${task.id}"]`);
        const isNewCard = !card;

        if (isNewCard) {
            card = document.createElement("div");
            card.className = "card task-card";
            card.setAttribute("draggable", "true");
            card.setAttribute("data-id", task.id);
            makeDraggable(card);
        }

        // lấy thông tin
        const title = task.title || "No Title";
        const description = task.description || "";
        const deadline = task.deadline ? task.deadline.substring(0,16).replace('T',' ') : "No Deadline";
        const assignedToName = task.assignedTo?.fullName || task.assignedToName || "Unassigned";
        const departmentName = task.department?.name || task.departmentName || "N/A";
        const createdByName = task.createdBy?.fullName || task.createdByName || "System";

        // render nội dung
        card.innerHTML = `
        <div class="card-body">
            <h5 class="card-title">${escapeHtml(title)}</h5>
            <p class="card-text">${escapeHtml(description)}</p>
            <div class="mb-2">
                <span class="badge bg-secondary">Deadline: ${escapeHtml(deadline)}</span>
                <span class="badge bg-info">Assigned: ${escapeHtml(assignedToName)}</span>
                <span class="badge bg-dark">Dept: ${escapeHtml(departmentName)}</span>
                <span class="badge bg-light text-dark">By: ${escapeHtml(createdByName)}</span>
            </div>
        </div>
    `;

        // tìm đúng cột theo status
        let selector;
        switch ((task.status || "").toUpperCase()) {
            case "TODO": selector = '[data-status="Todo"]'; break;
            case "IN-PROGRESS": selector = '[data-status="In-Progress"]'; break;
            case "DONE": selector = '[data-status="Done"]'; break;
        }

        if (selector) {
            const column = document.querySelector(selector);
            if (column && card.parentElement !== column) {
                column.appendChild(card);
            }
        }
    }


    // simple HTML escaper to avoid injection when interpolating
    function escapeHtml(str) {
        if (str === null || str === undefined) return "";
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // WebSocket setup (one place)
    const socket = new SockJS('/ws');
    const stompClient = Stomp.over(socket);

    stompClient.connect({}, function (frame) {
        console.log("Connected: " + frame);

        // topic broadcast (everyone)
        stompClient.subscribe('/topic/tasks', function (message) {
            const task = JSON.parse(message.body);
            updateTaskList(task);
        });

        // personal queue (if server sends to specific user)
        stompClient.subscribe('/user/queue/tasks', function (message) {
            const task = JSON.parse(message.body);
            updateTaskList(task);
        });
    }, function (err) {
        console.error("WebSocket error", err);
    });
</script>

</body>
</html>
