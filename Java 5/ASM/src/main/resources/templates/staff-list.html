<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Staff Task Board</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body { background: #f4f6f8; font-family: 'Segoe UI', sans-serif; }
        .kanban-board { display: flex; gap: 24px; padding: 32px 0; }
        .kanban-column {
            flex: 1;
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            min-height: 500px;
        }
        .kanban-column h4 {
            text-align: center;
            margin-bottom: 18px;
            font-weight: 600;
            text-transform: capitalize; /* Todo, In Progress, Done */
        }
        .task-card {
            margin-bottom: 16px;
            cursor: grab;
            border-left: 5px solid #0d6efd;
        }
        .drag-over {
            border: 2px dashed #0d6efd;
        }
    </style>
</head>
<body>
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Task Board</a>
        <div class="d-flex">
            <a href="/asm/logout" class="btn btn-danger btn-sm">Logout</a>
        </div>
    </div>
</nav>

<!-- Main -->
<div class="container mt-4">
    <h2 class="text-center mb-4">📌 Task Board - Department</h2>
    <div class="kanban-board">
        <!-- Todo -->
        <div class="kanban-column" data-status="Todo">
            <h4>📝 Todo</h4>
            <div th:each="t : ${tasks}" th:if="${t.status == 'Todo'}"
                 class="card task-card" draggable="true"
                 th:attr="data-id=${t.id}">
                <div class="card-body">
                    <h5 class="card-title" th:text="${t.title}"></h5>
                    <p class="card-text" th:text="${t.description}"></p>
                    <div class="mb-2">
                        <span class="badge bg-secondary"
                              th:text="'Deadline: ' + ${#temporals.format(t.deadline,'yyyy-MM-dd HH:mm')}"></span>
                        <span class="badge bg-info"
                              th:text="'Assigned: ' + ${t.assignedTo.fullName}"></span>
                        <span class="badge bg-dark"
                              th:text="'Dept: ' + ${t.assignedTo.department.name}"></span>
                        <span class="badge bg-light text-dark"
                              th:text="'By: ' + ${t.createdBy.fullName}"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- In Progress -->
        <div class="kanban-column" data-status="In-Progress">
            <h4>🚀 In Progress</h4>
            <div th:each="t : ${tasks}" th:if="${t.status == 'In-Progress'}"
                 class="card task-card" draggable="true"
                 th:attr="data-id=${t.id}">
                <div class="card-body">
                    <h5 class="card-title" th:text="${t.title}"></h5>
                    <p class="card-text" th:text="${t.description}"></p>
                    <div class="mb-2">
                        <span class="badge bg-secondary"
                              th:text="'Deadline: ' + ${#temporals.format(t.deadline,'yyyy-MM-dd HH:mm')}"></span>
                        <span class="badge bg-info"
                              th:text="'Assigned: ' + ${t.assignedTo.fullName}"></span>
                        <span class="badge bg-dark"
                              th:text="'Dept: ' + ${t.assignedTo.department.name}"></span>
                        <span class="badge bg-light text-dark"
                              th:text="'By: ' + ${t.createdBy.fullName}"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Done -->
        <div class="kanban-column" data-status="Done">
            <h4>✅ Done</h4>
            <div th:each="t : ${tasks}" th:if="${t.status == 'Done'}"
                 class="card task-card" draggable="true"
                 th:attr="data-id=${t.id}">
                <div class="card-body">
                    <h5 class="card-title" th:text="${t.title}"></h5>
                    <p class="card-text" th:text="${t.description}"></p>
                    <div class="mb-2">
                        <span class="badge bg-secondary"
                              th:text="'Deadline: ' + ${#temporals.format(t.deadline,'yyyy-MM-dd HH:mm')}"></span>
                        <span class="badge bg-info"
                              th:text="'Assigned: ' + ${t.assignedTo.fullName}"></span>
                        <span class="badge bg-dark"
                              th:text="'Dept: ' + ${t.assignedTo.department.name}"></span>
                        <span class="badge bg-light text-dark"
                              th:text="'By: ' + ${t.createdBy.fullName}"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- JS for DragDrop -->
<script>
    const tasks = document.querySelectorAll(".task-card");
    const columns = document.querySelectorAll(".kanban-column");

    tasks.forEach(task => {
        task.addEventListener("dragstart", () => {
            task.classList.add("dragging");
        });
        task.addEventListener("dragend", () => {
            task.classList.remove("dragging");
        });
    });

    columns.forEach(column => {
        column.addEventListener("dragover", e => {
            e.preventDefault();
            column.classList.add("drag-over");
        });
        column.addEventListener("dragleave", () => {
            column.classList.remove("drag-over");
        });

        column.addEventListener("drop", () => {
            column.classList.remove("drag-over");
            const dragging = document.querySelector(".dragging");
            if (!dragging) return;

            // 1. CHỈ DI CHUYỂN CARD (Card HTML gốc đã có đủ dữ liệu)
            column.appendChild(dragging);

            const taskId = dragging.getAttribute("data-id");
            const newStatus = column.getAttribute("data-status");

            // 2. ĐÁNH DẤU CARD ĐỂ BỎ QUA UPDATE TỪ WEBSOCKET (REAL-TIME)
            dragging.classList.add("task-updated-by-drag");

            fetch(`/staff/task/status/${taskId}`, {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: "status=" + encodeURIComponent(newStatus)
            }).then(() => {
                console.log("Updated task " + taskId + " -> " + newStatus);
                // 3. XÓA ĐÁNH DẤU SAU KHI SERVER PHẢN HỒI (để các update sau vẫn hoạt động)
                setTimeout(() => {
                    dragging.classList.remove("task-updated-by-drag");
                }, 100); // Đủ thời gian để xử lý WebSocket message
            });
        });
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>


<script>
    let socket = new SockJS('/ws');     // endpoint đã cấu hình trong WebSocketConfig
    let stompClient = Stomp.over(socket);

    stompClient.connect({}, function (frame) {
        console.log("Connected: " + frame);

        // Lắng nghe broadcast chung
        stompClient.subscribe('/topic/tasks', function (message) {
            let task = JSON.parse(message.body);
            updateTaskList(task);   // gọi hàm bạn đã viết
        });

        // Lắng nghe private queue (task gán cho user)
        stompClient.subscribe('/user/queue/tasks', function (message) {
            let task = JSON.parse(message.body);
            updateTaskList(task);   // gọi hàm bạn đã viết
        });
    });
</script>
<script>
    function makeDraggable(card) {
        card.addEventListener("dragstart", () => card.classList.add("dragging"));
        card.addEventListener("dragend", () => card.classList.remove("dragging"));
    }
</script>

<script>
    function updateTaskList(task) {
        console.log("Realtime update:", task);

        const existingCard = document.querySelector(`.task-card[data-id="${task.id}"]`);

        // 1. Xử lý trường hợp DELETED
        if(task.action === "DELETED") {
            existingCard?.remove();
            return;
        }

        let card = existingCard;
        const isNewCard = !card; // Kiểm tra xem đây có phải là card mới hay không

        // 2. Xử lý Tạo mới Card
        if(isNewCard) {
            card = document.createElement("div");
            card.className = "card task-card";
            card.setAttribute("draggable", "true");
            card.setAttribute("data-id", task.id);
            makeDraggable(card); // Gán lại event listeners cho card mới
        }

        // 3. Xử lý Missing Badge Content và Cập nhật Nội dung:
        // CHỈ CẬP NHẬT NỘI DUNG CARD NẾU LÀ CARD MỚI HOẶC DỮ LIỆU CÓ ĐẦY ĐỦ
        // Nếu task object từ WebSocket thiếu dữ liệu (assignedTo/createdBy là null),
        // ta KHÔNG ghi đè nội dung HTML của card đang tồn tại.

        // Kiểm tra xem task object có chứa dữ liệu chi tiết không
        const hasFullData = task.assignedTo?.fullName && task.createdBy?.fullName && task.description;

        if (isNewCard || hasFullData) {
            // Dùng dữ liệu từ task, nếu thiếu dùng giá trị mặc định
            const title = task.title || "No Title";
            const description = task.description || "";
            const deadline = task.deadline ? task.deadline.substring(0, 16).replace('T', ' ') : "No Deadline";
            const assignedTo = task.assignedTo?.fullName || "Unassigned";
            const department = task.assignedTo?.department?.name || "N/A";
            const createdBy = task.createdBy?.fullName || "System";

            // Cập nhật nội dung card
            card.innerHTML = `
            <div class="card-body">
                <h5 class="card-title">${title}</h5>
                <p class="card-text">${description}</p>
                <div class="mb-2">
                    <span class="badge bg-secondary">Deadline: ${deadline}</span>
                    <span class="badge bg-info">Assigned: ${assignedTo}</span>
                    <span class="badge bg-dark">Dept: ${department}</span>
                    <span class="badge bg-light text-dark">By: ${createdBy}</span>
                </div>
            </div>
            `;
        } else {
            // Đây là card đã tồn tại và update từ WebSocket thiếu dữ liệu chi tiết (chắc chắn là update status).
            // Ta BỎ QUA việc ghi đè nội dung, chỉ thực hiện bước 4 (di chuyển).
            console.log("Skipping content update for existing task (data incomplete):", task.id);
        }

        // 4. Di chuyển card đến cột mới (bắt buộc phải thực hiện)
        let status = (task.status || "").toUpperCase().replace("_", "-");
        let selector = "";

        if (status === "TODO") {
            selector = '[data-status="Todo"]';
        } else if (status === "IN-PROGRESS") {
            selector = '[data-status="In-Progress"]';
        } else if (status === "DONE") {
            selector = '[data-status="Done"]';
        } else {
            return;
        }

        const column = document.querySelector(selector);

        // Chỉ thêm vào column nếu card chưa ở đúng vị trí
        if(column && card.parentElement !== column) {
            column.appendChild(card);
        }
    }
</script>


</body>
</html>
