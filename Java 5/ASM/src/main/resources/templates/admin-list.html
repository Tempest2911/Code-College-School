<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Task Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8f9fa;
        }

        .card {
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .table thead th {
            background: #343a40;
            color: #fff;
        }

        .priority-options {
            display: flex;
            gap: 20px;
        }

        .priority-options label {
            font-weight: normal;
        }

        .navbar-brand {
            font-weight: bold;
        }

        /* Badge cho Status */
        .status-todo {
            background-color: #0d6efd !important; /* xanh dương */
        }

        .status-inprogress {
            background-color: #ffc107 !important; /* vàng */
            color: #000 !important;
        }

        .status-done {
            background-color: #28a745 !important; /* xanh lá */
        }

        /* Badge cho Priority */
        .priority-low {
            background-color: #28a745 !important; /* xanh lá */
        }

        .priority-medium {
            background-color: #fd7e14 !important; /* cam */
        }

        .priority-high {
            background-color: #dc3545 !important; /* đỏ */
        }

        /* Dropdown Status có màu */
        .status-select option[value="Todo"] {
            background-color: #0d6efd;
            color: #fff;
        }

        .status-select option[value="In-Progress"] {
            background-color: #ffc107;
            color: #000;
        }

        .status-select option[value="Done"] {
            background-color: #28a745;
            color: #fff;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/admin/task/list">Admin - Task Board</a>
        <div class="d-flex">
            <a href="/admin/task/dashboard" class="btn btn-info btn-sm me-2">📊 Dashboard</a>
            <a href="/asm/logout" class="btn btn-danger btn-sm">Logout</a>
        </div>
    </div>
</nav>


<div class="container mt-4">


    <!-- Form tạo/cập nhật Task -->
    <div class="card mb-4">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">
                Create / Update Task
            </h5>
        </div>
        <div class="card-body">
            <form th:action="@{/admin/task/create}" th:object="${task}" method="post">
                <input type="hidden" th:field="*{id}"/>

                <div class="mb-3">
                    <label class="form-label">Title</label>
                    <input type="text" class="form-control" th:field="*{title}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" th:field="*{description}" rows="3"></textarea>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Status</label>
                        <select class="form-select status-select" th:field="*{status}">
                            <option value="Todo">Todo</option>
                            <option value="In-Progress">In-Progress</option>
                            <option value="Done">Done</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Deadline</label>
                        <input type="datetime-local" class="form-control" th:field="*{deadline}">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Priority</label>
                        <div class="priority-options">
                            <label><input type="radio" th:field="*{priority}" value="Low"> <span
                            >Low</span></label>
                            <label><input type="radio" th:field="*{priority}" value="Medium"> <span
                            >Medium</span></label>
                            <label><input type="radio" th:field="*{priority}" value="High"> <span
                            >High</span></label>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Assign to Staff</label>
                        <select class="form-select" th:field="*{assignedTo.id}">
                            <option value="">-- Select Staff --</option>
                            <option th:each="u : ${staffList}" th:value="${u.id}"></option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Department</label>
                        <select class="form-select" th:field="*{department.id}">
                            <option value="">-- Select Department --</option>
                            <option th:each="d : ${departments}" th:value="${d.id}"></option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn btn-success"
                        th:text="${task.id == null} ? 'Create' : 'Update'">
                    Create / Update
                </button>

            </form>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Search</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/admin/task/search}" method="get">
                <div class="row mb-3">
                    <div class="col-md-3">
                        <label class="form-label">Title</label>
                        <input type="text" class="form-control" name="keyword" th:value="${keyword}"
                               placeholder="Search by title">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Start DateTime</label>
                        <input type="datetime-local" class="form-control" name="startDate" th:value="${startDate}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">End DateTime</label>
                        <input type="datetime-local" class="form-control" name="endDate" th:value="${endDate}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Department</label>
                        <select class="form-select" name="departmentId">
                            <option value="">All Departments</option>
                            <option th:each="d : ${departments}" th:value="${d.id}"
                                    th:selected="${departmentId} == ${d.id}"></option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Search</button>
            </form>
        </div>
    </div>

    <div>
        <form th:action="@{/admin/task/sortLowToHigh}" method="get">
            <button type="submit" class="btn btn-primary">Sort from low to high</button>
        </form>

        <form th:action="@{/admin/task/sortHighToLow}" method="get">
            <button type="submit" class="btn btn-primary">Sort from high to low</button>

        </form>
    </div>

    <!-- Danh sách Task -->
    <div class="card">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">All Tasks</h5>
        </div>
        <div class="card-body">
            <table class="table table-striped table-hover" id="taskTable">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Status</th>
                    <th>Priority</th>
                    <th>Deadline</th>
                    <th>Assigned To</th>
                    <th>Department</th>
                    <th>Created By</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="t : ${tasks}" th:attr="data-id=${t.id}">
                    <td th:text="${t.id}"></td>
                    <td th:text="${t.title}"></td>
                    <td th:text="${t.description}"></td>

                    <!-- Status badge -->
                    <td>
    <span th:classappend="
        ${t.status}=='Todo' ? 'badge status-todo' :
        (${t.status}=='In-Progress' ? 'badge status-inprogress' : 'badge status-done')"
          th:text="${t.status}"></span>
                    </td>

                    <td>
    <span th:classappend="
        ${t.priority}=='Low' ? 'badge priority-low' :
        (${t.priority}=='Medium' ? 'badge priority-medium' : 'badge priority-high')"
          th:text="${t.priority}"></span>
                    </td>

                    <td>
                        <span th:if="${t.deadline != null}">
                            <span th:if="${t.deadline.isBefore(T(java.time.LocalDateTime).now())}"
                                  class="badge bg-danger">⏰ Overdue</span>

                            <span th:if="${t.deadline.isAfter(T(java.time.LocalDateTime).now())
                                          and T(java.time.Duration).between(T(java.time.LocalDateTime).now(), t.deadline).toHours() <= 24}"
                                  class="badge bg-warning text-dark">⚠️ Due Soon</span>

                            <span th:if="${t.deadline.isAfter(T(java.time.LocalDateTime).now())
                                          and T(java.time.Duration).between(T(java.time.LocalDateTime).now(), t.deadline).toHours() > 24}"
                                  class="badge bg-success">✅ On Time</span>

                            <span class="badge bg-light text-dark"
                                  th:text="${#temporals.format(t.deadline, 'yyyy-MM-dd HH:mm')}"></span>
                        </span>
                    </td>

                    <td th:text="${t.assignedTo != null ? t.assignedTo.username : ''}"></td>
                    <td th:text="${t.department != null ? t.department.name : ''}"></td>
                    <td th:text="${t.createdBy != null ? t.createdBy.username : ''}"></td>
                    <td>
                        <a th:href="@{'/admin/task/edit/' + ${t.id}}" class="btn btn-sm btn-warning"
                        >Edit</a>
                        <a th:href="@{'/admin/task/delete/' + ${t.id}}"
                           onclick="return confirm('Are you sure to delete this task?')"
                           class="btn btn-sm btn-danger"
                        >Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>

            <!-- Switch language -->
            <a href="?lang=en">English</a> | <a href="?lang=vi">Tiếng Việt</a>

            <!-- Pagination -->
            <nav th:if="${totalPages > 1}">
                <ul class="pagination justify-content-center mt-4">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/admin/task/search(
                                keyword=${keyword},
                                departmentId=${departmentId},
                                startDate=${startDate},
                                endDate=${endDate},
                                sort=${sort},
                                page=${currentPage - 1},
                                size=${size}
                            )}">Previous</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link"
                           th:href="@{/admin/task/search(
                                keyword=${keyword},
                                departmentId=${departmentId},
                                startDate=${startDate},
                                endDate=${endDate},
                                sort=${sort},
                                page=${i},
                                size=${size}
                            )}"
                           th:text="${i + 1}"></a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/admin/task/search(
                                keyword=${keyword},
                                departmentId=${departmentId},
                                startDate=${startDate},
                                endDate=${endDate},
                                sort=${sort},
                                page=${currentPage + 1},
                                size=${size}
                            )}">Next</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

</div>


<!-- Thêm thư viện WebSocket -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script>
    // Cập nhật bảng task khi có thông báo WebSocket
    function updateTaskTable(task) {
        console.log('[ADMIN] Received task update:', task);
        const table = document.getElementById("taskTable");
        if (!table) {
            console.log('[ADMIN] Table not found');
            return;
        }
        const row = table.querySelector(`tr[data-id='${task.id}']`);
        if (!row) {
            console.log(`[ADMIN] Row with data-id=${task.id} not found`);
            return;
        }

        if (task.action === "DELETED") {
            row.remove();
            console.log(`[ADMIN] Row with id ${task.id} removed`);
            return;
        }

        // Chỉ cập nhật cột Status (td thứ 4, index 3)
        const statusTd = row.children[3];
        if (statusTd) {
            let badgeClass = '';
            let statusText = '';
            if (task.status === 'Done') {
                badgeClass = 'badge status-done';
                statusText = 'Done';
            } else if (task.status === 'In-Progress') {
                badgeClass = 'badge status-inprogress';
                statusText = 'In Progress';
            } else {
                badgeClass = 'badge status-todo';
                statusText = 'Todo';
            }
            statusTd.innerHTML = `<span class="${badgeClass}">${statusText}</span>`;
            console.log(`[ADMIN] Updated status for id ${task.id} to ${statusText}`);
        } else {
            console.log(`[ADMIN] Status TD not found for row id ${task.id}`);
        }
    }

    // Đảm bảo JS chỉ chạy sau khi DOM load xong
    window.addEventListener('DOMContentLoaded', function () {
        const socket = new SockJS('/ws');
        const stompClient = Stomp.over(socket);
        stompClient.connect({}, function (frame) {
            stompClient.subscribe('/topic/tasks', function (message) {
                const task = JSON.parse(message.body);
                updateTaskTable(task);
            });
        });
    });
</script>

</body>
</html>
