<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="#{title}">Admin Task Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8f9fa;
        }

        .card {
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .table thead th {
            background: #343a40;
            color: #fff;
        }

        .priority-options {
            display: flex;
            gap: 20px;
        }

        .priority-options label {
            font-weight: normal;
        }

        .navbar-brand {
            font-weight: bold;
        }

        /* Badge cho Status */
        .status-todo {
            background-color: #0d6efd !important; /* xanh dương */
        }

        .status-inprogress {
            background-color: #ffc107 !important; /* vàng */
            color: #000 !important;
        }

        .status-done {
            background-color: #28a745 !important; /* xanh lá */
        }

        /* Badge cho Priority */
        .priority-low {
            background-color: #28a745 !important; /* xanh lá */
        }

        .priority-medium {
            background-color: #fd7e14 !important; /* cam */
        }

        .priority-high {
            background-color: #dc3545 !important; /* đỏ */
        }

        /* Dropdown Status có màu */
        .status-select option[value="Todo"] {
            background-color: #0d6efd;
            color: #fff;
        }

        .status-select option[value="In-Progress"] {
            background-color: #ffc107;
            color: #000;
        }

        .status-select option[value="Done"] {
            background-color: #28a745;
            color: #fff;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#" th:text="#{title}">Admin - Task Board</a>
        <div class="d-flex">
            <a href="/admin/task/dashboard" class="btn btn-info btn-sm me-2">📊 Dashboard</a>
            <a href="/asm/logout" class="btn btn-danger btn-sm">Logout</a>
        </div>
    </div>
</nav>


<div class="container mt-4">

    <!-- Form tạo/cập nhật Task -->
    <div class="card mb-4">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0"
                th:text="${task.id == null} ? #{button.create} : #{button.update}">
                Create / Update Task
            </h5>
        </div>
        <div class="card-body">
            <form th:action="@{/admin/task/update}" th:object="${task}" method="post">
                <input type="hidden" th:field="*{id}"/>

                <div class="mb-3">
                    <label class="form-label" th:text="#{task.title}">Title</label>
                    <input type="text" class="form-control" th:field="*{title}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label" th:text="#{task.description}">Description</label>
                    <textarea class="form-control" th:field="*{description}" rows="3"></textarea>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label" th:text="#{task.status}">Status</label>
                        <select class="form-select status-select" th:field="*{status}">
                            <option value="Todo" th:text="#{status.Todo}">Todo</option>
                            <option value="In-Progress" th:text="#{status.In-Progress}">In-Progress</option>
                            <option value="Done" th:text="#{status.Done}">Done</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label" th:text="#{task.deadline}">Deadline</label>
                        <input type="datetime-local" class="form-control" th:field="*{deadline}">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label" th:text="#{task.priority}">Priority</label>
                        <div class="priority-options">
                            <label><input type="radio" th:field="*{priority}" value="Low"> <span
                                    th:text="#{priority.Low}">Low</span></label>
                            <label><input type="radio" th:field="*{priority}" value="Medium"> <span
                                    th:text="#{priority.Medium}">Medium</span></label>
                            <label><input type="radio" th:field="*{priority}" value="High"> <span
                                    th:text="#{priority.High}">High</span></label>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label" th:text="#{task.assignedTo}">Assign to Staff</label>
                        <select class="form-select" th:field="*{assignedTo.id}">
                            <option value="" th:text="#{select.staff}">-- Select Staff --</option>
                            <option th:each="u : ${staffList}" th:value="${u.id}" th:text="${u.username}"></option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label" th:text="#{task.department}">Department</label>
                        <select class="form-select" th:field="*{department.id}">
                            <option value="" th:text="#{select.department}">-- Select Department --</option>
                            <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"></option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn btn-success"
                        th:text="${task.id == null} ? #{button.create} : #{button.update}">
                    Create / Update
                </button>
            </form>
        </div>
    </div>



    <!-- Danh sách Task -->
    <div class="card">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0" th:text="#{task.list}">All Tasks</h5>
        </div>
        <div class="card-body">
            <table class="table table-striped table-hover">
                <thead>
                <tr>
                    <th th:text="#{task.id}">ID</th>
                    <th th:text="#{task.title}">Title</th>
                    <th th:text="#{task.description}">Description</th>
                    <th th:text="#{task.status}">Status</th>
                    <th th:text="#{task.priority}">Priority</th>
                    <th th:text="#{task.deadline}">Deadline</th>
                    <th th:text="#{task.assignedTo}">Assigned To</th>
                    <th th:text="#{task.department}">Department</th>
                    <th th:text="#{task.createdBy}">Created By</th>
                    <th th:text="#{task.action}">Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="t : ${tasks}">
                    <td th:text="${t.id}"></td>
                    <td th:text="${t.title}"></td>
                    <td th:text="${t.description}"></td>

                    <!-- Status badge -->
                    <td>
                        <span th:classappend="
                            ${t.status}=='Todo' ? 'badge status-todo' :
                            (${t.status}=='In-Progress' ? 'badge status-inprogress' : 'badge status-done')"
                              th:text="#{${'status.' + t.status}}"></span>
                    </td>

                    <!-- Priority badge -->
                    <td>
                        <span th:classappend="
                            ${t.priority}=='Low' ? 'badge priority-low' :
                            (${t.priority}=='Medium' ? 'badge priority-medium' : 'badge priority-high')"
                              th:text="#{${'priority.' + t.priority}}"></span>
                    </td>

                    <td>
                        <span th:if="${t.deadline != null}">
                            <span th:if="${t.deadline.isBefore(T(java.time.LocalDateTime).now())}"
                                  class="badge bg-danger">⏰ Overdue</span>

                            <span th:if="${t.deadline.isAfter(T(java.time.LocalDateTime).now())
                                          and T(java.time.Duration).between(T(java.time.LocalDateTime).now(), t.deadline).toHours() <= 24}"
                                  class="badge bg-warning text-dark">⚠️ Due Soon</span>

                            <span th:if="${t.deadline.isAfter(T(java.time.LocalDateTime).now())
                                          and T(java.time.Duration).between(T(java.time.LocalDateTime).now(), t.deadline).toHours() > 24}"
                                  class="badge bg-success">✅ On Time</span>

                            <span class="badge bg-light text-dark"
                                  th:text="${#temporals.format(t.deadline, 'yyyy-MM-dd HH:mm')}"></span>
                        </span>
                    </td>

                    <td th:text="${t.assignedTo != null ? t.assignedTo.username : ''}"></td>
                    <td th:text="${t.department != null ? t.department.name : ''}"></td>
                    <td th:text="${t.createdBy != null ? t.createdBy.username : ''}"></td>
                    <td>
                        <a th:href="@{'/admin/task/edit/' + ${t.id}}" class="btn btn-sm btn-warning"
                           th:text="#{button.edit}">Edit</a>
                        <a th:href="@{'/admin/task/delete/' + ${t.id}}"
                           onclick="return confirm('Are you sure to delete this task?')"
                           class="btn btn-sm btn-danger"
                           th:text="#{button.delete}">Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>

            <!-- Switch language -->
            <a href="?lang=en">English</a> | <a href="?lang=vi">Tiếng Việt</a>
        </div>
    </div>

</div>


</body>
</html>
