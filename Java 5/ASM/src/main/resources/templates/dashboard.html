<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/admin/task">Admin - Task Board</a>
        <div class="d-flex">
            <a href="/asm/logout" class="btn btn-danger btn-sm">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">📊 Dashboard - Năng suất nhân viên</h5>
        </div>
        <div class="card-body">
            <canvas id="barChart" height="120"></canvas>
        </div>
    </div>
</div>

<!-- Script phải có th:inline="javascript" -->
<script th:inline="javascript">
    const ctx = document.getElementById('barChart');

    const labels = /*[[${labels}]]*/ [];
    const data = /*[[${data}]]*/ [];

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: 'Số task hoàn thành',
                data: data,
                backgroundColor: 'rgba(54, 162, 235, 0.7)',
                borderColor: 'rgba(54, 162, 235, 1)',
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { display: true, onClick: null }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    title: { display: true, text: "Số Task" }
                }
            }
        }
    });
</script>

</body>
</html>
