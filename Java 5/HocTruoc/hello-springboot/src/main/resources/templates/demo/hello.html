<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Demo Page</title>
</head>
<body>
<!-- Hiển thị subject nếu có -->
<!-- Chỉ hiển thị nếu subject, author, year tồn tại -->
<div th:if="${subject != null}">
    <h1 th:text="${subject}">Default Subject</h1>
    <p>Tác giả: <span th:text="${author}">Name</span></p>
    <p>Năm: <span th:text="${year}">year</span></p>
</div>


<!-- Hiển thị danh sách sinh viên nếu có -->
<div th:if="${students != null}">
    <h2>Danh sách sinh viên</h2>
    <ul>
        <li th:each="sv : ${students}" th:text="${sv}">Tên mặc định</li>
    </ul>
</div>

<!-- Dùng switch để phân biệt -->
<div th:switch="${view}">

    <!-- Danh sách -->
    <div th:case="'list'">
        <h1>Danh sách Chủ Nhà</h1>

        <table border="1">
            <tr>
                <th>ID</th>
                <th>Tên</th>
                <th>Địa chỉ</th>
                <th>SĐT</th>
                <th>Email</th>
                <th>Hành động</th>
            </tr>
            <tr th:each="cn : ${chuNha}">
                <td th:text="${cn.id}"></td>
                <td th:text="${cn.ten}"></td>
                <td th:text="${cn.diaChi}"></td>
                <td th:text="${cn.soDienThoai}"></td>
                <td th:text="${cn.email}"></td>
                <td>
                    <a th:href="@{'/chunha/edit/' + ${cn.id}}">Sửa</a> |
                    <a th:href="@{'/chunha/delete/' + ${cn.id}}" onclick="return confirm('Xóa?')">Xóa</a>
                </td>
            </tr>
        </table>
        <a th:href="@{/chunha/add}">Thêm</a>
    </div>

    <!-- Form -->
    <div th:case="'form'">
        <h1 th:text="${chuNha.id == null} ? 'Thêm Chủ Nhà' : 'Sửa Chủ Nhà'"></h1>
        <form th:action="@{/chunha/save}" th:object="${chuNha}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <label>Tên:</label>
            <input type="text" th:field="*{ten}" required/><br/>

            <label>Địa chỉ:</label>
            <input type="text" th:field="*{diaChi}" required/><br/>

            <label>SĐT:</label>
            <input type="text" th:field="*{soDienThoai}" required/><br/>

            <label>Email:</label>
            <input type="email" th:field="*{email}" required/><br/>

            <button type="submit">Lưu</button>
        </form>
        <a th:href="@{/chunha}">⬅ Quay lại danh sách</a>
    </div>

</div>
</body>
</html>
