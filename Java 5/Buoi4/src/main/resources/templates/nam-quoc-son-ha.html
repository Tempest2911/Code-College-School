<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Nam Quốc Sơn Hà</title>
    <style>
        body {
            font-family: "Times New Roman", serif;
            background-color: #f4f4f4;
            color: #333;
            max-width: 700px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #006400;
        }
        .poem {
            white-space: pre-line;
            line-height: 1.8;
            font-size: 1.2em;
        }
        .author {
            text-align: right;
            margin-top: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>

<h1>Nam Quốc Sơn Hà</h1>

<div class="poem">
    Nam quốc sơn hà Nam đế cư,<br>
    Tuyệt nhiên định phận tại thiên thư.<br>
    Như hà nghịch lỗ lai xâm phạm?<br>
    Nhữ đẳng hành khan thủ bại hư!
</div>

<div class="author">
    — Lý Thường Kiệt —
</div>

</body>
</html>
