<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cảnh Khuya</title>
    <style>
        body {
            font-family: "Times New Roman", serif;
            background-color: #f4f4f4;
            color: #333;
            max-width: 700px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #006400;
        }

        .poem {
            white-space: pre-line;
            line-height: 1.8;
            font-size: 1.2em;
        }

        .author {
            text-align: right;
            margin-top: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>

<h1>Cảnh Khuya</h1>

<div class="poem">
    Tiếng suối trong như tiếng hát xa,<br>
    Trăng lưng chừng buổi sáng vắt qua.<br>
    Cảnh khuya như vẽ người chưa ngủ,<br>
    Chưa ngủ vì lo nỗi nước nhà.
</div>

<div class="author">
    — Hồ Chí Minh —
</div>

</body>
</html>
